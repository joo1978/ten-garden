<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TEN GARDEN</title>
<style>
  :root{
    --bg-top:#eef7ec;
    --bg-bottom:#dcefd9;
    --ink:#2e3d2a;
    --ink-soft:#5c6f56;
    --tile:#ffffff;
    --tile-border:#cfe3c8;
    --tile-selected:#ffe3a6;
    --tile-selected-border:#f2b93f;
    --tile-ready:#bdeecb;
    --tile-ready-border:#4caf6e;
    --tile-reject:#ffd3d3;
    --tile-reject-border:#e2635f;
    --accent:#4c8c5c;
    --accent-deep:#356a41;
    --panel:#ffffffcc;
    --shadow:0 2px 10px rgba(46,61,42,0.12);
    --danger:#c85a52;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  html{
    position:fixed;
    inset:0;
    overflow:hidden;
    touch-action:none;
  }
  body{
    position:fixed;
    inset:0;
    overflow:hidden;
    touch-action:none;
    display:flex;
    justify-content:center;
  }
  .wrap{
    width:100%;
    max-width:480px;
    min-width:0;
    height:100%;
    min-height:0;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 10px);
    display:flex;
    flex-direction:column;
    gap:8px;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
  }

  header{ text-align:center; flex:0 0 auto; }
  h1{
    margin:0;
    font-size:26px;
    letter-spacing:2px;
    color:var(--accent-deep);
    font-weight:800;
  }
  .rule-line{
    margin:4px 0 0;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.4;
  }

  .hud{
    display:flex;
    gap:8px;
    align-items:stretch;
    flex:0 0 auto;
  }
  .panel{
    background:var(--panel);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:8px 12px;
  }
  .score-panel{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; }
  .combo-badge{
    position:absolute;
    top:-8px; right:6px;
    background:#ff8a3d;
    color:#fff;
    font-size:11px;
    font-weight:800;
    padding:3px 8px;
    border-radius:999px;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
    opacity:0;
    transform:scale(0.7);
    transition:opacity .15s, transform .15s;
    pointer-events:none;
    white-space:nowrap;
  }
  .combo-badge.active{ opacity:1; transform:scale(1); }

  .milestone-toast{
    position:fixed;
    top:calc(env(safe-area-inset-top,0px) + 14px);
    left:50%;
    transform:translate(-50%,-16px);
    background:var(--accent-deep);
    color:#fff;
    font-weight:800;
    font-size:14px;
    padding:10px 18px;
    border-radius:999px;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
    opacity:0;
    transition:opacity .25s, transform .25s;
    z-index:20;
    pointer-events:none;
    white-space:nowrap;
  }
  .milestone-toast.show{ opacity:1; transform:translate(-50%,0); }
  .score-panel .label{ font-size:11px; color:var(--ink-soft); }
  .score-panel .value{ font-size:22px; font-weight:800; color:var(--accent-deep); }
  .best-panel{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .best-panel .label{ font-size:11px; color:var(--ink-soft); }
  .best-panel .value{ font-size:16px; font-weight:700; color:var(--ink); }

  .sum-readout{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    min-width:64px;
  }
  .sum-readout .num{
    font-size:24px;
    font-weight:800;
    color:var(--ink-soft);
    transition:color .12s;
  }
  .sum-readout.ready .num{ color:var(--accent-deep); }
  .sum-readout.over .num{ color:var(--danger); }
  .sum-readout .of10{ font-size:11px; color:var(--ink-soft); }

  .board-frame{
    background:var(--panel);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:8px;
    min-width:0;
    min-height:0;
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:none;
    overflow:hidden;
  }
  .board{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    grid-template-rows:repeat(6,1fr);
    gap:6px;
    touch-action:none;
    flex:0 0 auto;
  }
  .tile{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--tile);
    border:2px solid var(--tile-border);
    border-radius:10px;
    font-size:clamp(15px,5.2vw,24px);
    font-weight:800;
    color:var(--ink);
    touch-action:none;
    transition:transform .08s, background .08s, border-color .08s;
  }
  .tile.empty{ background:transparent; border-color:transparent; }
  .tile.selected{
    background:var(--tile-selected);
    border-color:var(--tile-selected-border);
    transform:scale(0.94);
  }
  .tile.selected.ready{
    background:var(--tile-ready);
    border-color:var(--tile-ready-border);
  }
  .tile.reject{
    animation:shake .22s;
    background:var(--tile-reject);
    border-color:var(--tile-reject-border);
  }
  .tile.new-tile{
    animation:drop .22s ease-out;
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-4px); }
    75%{ transform:translateX(4px); }
  }
  @keyframes drop{
    0%{ transform:translateY(-14px); opacity:0; }
    100%{ transform:translateY(0); opacity:1; }
  }

  .footer-stats{
    display:flex;
    gap:8px;
    flex:0 0 auto;
  }
  .stat-chip{
    flex:1;
    background:var(--panel);
    border-radius:12px;
    box-shadow:var(--shadow);
    padding:7px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .stat-chip .icon{ font-size:16px; }
  .stat-chip .num{ font-size:14px; font-weight:800; color:var(--accent-deep); }
  .stat-chip .label{ font-size:10px; color:var(--ink-soft); }

  .bottom-row{ display:flex; gap:8px; align-items:center; flex:0 0 auto; }
  .reset-btn{
    border:none;
    background:var(--panel);
    box-shadow:var(--shadow);
    border-radius:12px;
    padding:8px 14px;
    font-size:13px;
    color:var(--ink-soft);
    font-weight:700;
  }
  .reset-btn:active{ transform:scale(0.97); }

  .overlay{
    position:fixed; inset:0;
    background:rgba(46,61,42,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:10;
  }
  .overlay.hidden{ display:none; }
  .overlay-card{
    background:#fff;
    border-radius:20px;
    padding:26px 22px;
    max-width:340px;
    width:100%;
    max-height:calc(100dvh - 40px);
    overflow-y:auto;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
  }
  .overlay-card h2{
    margin:0 0 4px;
    color:var(--accent-deep);
    font-size:22px;
  }
  .overlay-card .sub{ font-size:12px; color:var(--ink-soft); margin-bottom:14px; }
  .overlay-stats{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:18px;
  }
  .overlay-stat-row{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    padding:6px 10px;
    background:#f4f9f2;
    border-radius:10px;
  }
  .overlay-stat-row .k{ color:var(--ink-soft); }
  .overlay-stat-row .v{ font-weight:800; color:var(--ink); }
  .overlay-stat-row.new-best .v{ color:var(--accent-deep); }
  .play-again{
    width:100%;
    border:none;
    background:var(--accent);
    color:#fff;
    font-weight:800;
    font-size:15px;
    padding:12px;
    border-radius:12px;
  }
  .play-again:active{ transform:scale(0.98); }

  .rank-submit{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:10px;
  }
  .nickname-input{
    width:100%;
    border:2px solid var(--tile-border);
    border-radius:10px;
    padding:9px 12px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
  }
  .nickname-input:focus{ outline:none; border-color:var(--accent); }
  .submit-rank-btn{
    width:100%;
    border:none;
    background:#fff;
    color:var(--accent-deep);
    border:2px solid var(--accent);
    font-weight:800;
    font-size:14px;
    padding:9px;
    border-radius:10px;
  }
  .submit-rank-btn:active{ transform:scale(0.98); }
  .submit-rank-btn:disabled{ opacity:0.5; }
  .rank-status{
    min-height:16px;
    font-size:12px;
    color:var(--ink-soft);
  }
  .rank-status.ok{ color:var(--accent-deep); font-weight:700; }
  .rank-status.err{ color:var(--danger); }

  .leaderboard-list{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:16px;
    text-align:left;
    max-height:50vh;
    overflow-y:auto;
  }
  .leaderboard-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 10px;
    background:#f4f9f2;
    border-radius:10px;
    font-size:13px;
  }
  .leaderboard-row .rank{ width:22px; font-weight:800; color:var(--ink-soft); flex:0 0 auto; }
  .leaderboard-row .name{ flex:1; font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .leaderboard-row .score{ font-weight:800; color:var(--accent-deep); flex:0 0 auto; }
  .leaderboard-empty, .leaderboard-error{ font-size:13px; color:var(--ink-soft); padding:14px 0; text-align:center; }

  .rank-highlight{
    display:none;
    background:linear-gradient(135deg,#ffb84d,#ff8a3d);
    color:#fff;
    font-weight:800;
    font-size:13px;
    padding:10px 12px;
    border-radius:12px;
    margin-bottom:12px;
    animation:pulse-glow 1.4s ease-in-out infinite;
  }
  .rank-highlight.show{ display:block; }
  @keyframes pulse-glow{
    0%,100%{ box-shadow:0 0 0 rgba(255,138,61,0.5); }
    50%{ box-shadow:0 0 14px rgba(255,138,61,0.6); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TEN GARDEN</h1>
    <p class="rule-line">인접한(대각선 포함) 숫자를 이어 합이 10이 되거나, 같은 숫자를 이으면 성공!<br>길게 이을수록 점수·콤보·꽃이 커집니다.</p>
  </header>

  <div class="hud">
    <div class="panel score-panel">
      <div class="label">SCORE</div>
      <div class="value" id="scoreVal">0</div>
      <div class="combo-badge" id="comboBadge"></div>
    </div>
    <div class="panel sum-readout" id="sumReadout">
      <div class="num" id="sumVal">0</div>
      <div class="of10">/10</div>
    </div>
    <div class="panel best-panel">
      <div class="label">BEST</div>
      <div class="value" id="bestVal">0</div>
    </div>
  </div>

  <div class="board-frame" id="boardFrame">
    <div class="board" id="board"></div>
  </div>

  <div class="footer-stats">
    <div class="stat-chip">
      <div class="icon">🌸</div>
      <div class="num" id="flowerVal">0</div>
      <div class="label">꽃</div>
    </div>
    <div class="stat-chip">
      <div class="icon">🌻</div>
      <div class="num" id="bigFlowerVal">0</div>
      <div class="label">큰 꽃</div>
    </div>
    <div class="stat-chip">
      <div class="icon">🔗</div>
      <div class="num" id="chainVal">0</div>
      <div class="label">최장 연결</div>
    </div>
  </div>

  <div class="bottom-row">
    <button class="reset-btn" id="resetBtn">↻ 새 게임</button>
    <button class="reset-btn" id="leaderboardBtn">🏆 랭킹</button>
  </div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="overlay-card">
    <h2>정원이 가득 찼습니다</h2>
    <div class="sub">더 이상 새 숫자를 놓을 자리가 없어요</div>
    <div class="overlay-stats">
      <div class="overlay-stat-row" id="finalScoreRow"><span class="k">이번 점수</span><span class="v" id="finalScore">0</span></div>
      <div class="overlay-stat-row"><span class="k">최고 점수</span><span class="v" id="finalBest">0</span></div>
      <div class="overlay-stat-row"><span class="k">최장 연결</span><span class="v" id="finalChain">0</span></div>
      <div class="overlay-stat-row"><span class="k">피운 꽃</span><span class="v" id="finalFlowers">0</span></div>
      <div class="overlay-stat-row"><span class="k">최고 콤보</span><span class="v" id="finalCombo">0</span></div>
      <div class="overlay-stat-row"><span class="k">달성한 목표</span><span class="v" id="finalMilestones">0</span></div>
    </div>
    <div class="rank-highlight" id="rankHighlight">🏆 최고 점수를 기록했습니다! 닉네임을 입력하고 랭킹에 등록해보세요</div>
    <div class="rank-submit">
      <input type="text" id="nicknameInput" class="nickname-input" placeholder="닉네임 (최대 12자)" maxlength="12">
      <button class="submit-rank-btn" id="submitRankBtn">랭킹 등록</button>
      <div class="rank-status" id="rankStatus"></div>
    </div>
    <button class="play-again" id="playAgainBtn">다시 심기</button>
  </div>
</div>

<div class="overlay hidden" id="leaderboardOverlay">
  <div class="overlay-card">
    <h2>🏆 랭킹</h2>
    <div class="sub">지인들과의 최고 기록</div>
    <div class="leaderboard-list" id="leaderboardList"></div>
    <button class="play-again" id="closeLeaderboardBtn">닫기</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var SIZE = 6;
  var INITIAL_TILES = 28;
  var GROWTH_COUNT = 3;
  var MAX_SOLVE_ATTEMPTS = 30;
  var SHUFFLE_ATTEMPTS_BEFORE_REGEN = 5;

  var LS_BEST_SCORE = "tengarden-best-score";
  var LS_BEST_CHAIN = "tengarden-best-chain";
  var LS_BEST_FLOWERS = "tengarden-best-flowers";

  var MILESTONES = [150,400,800,1400,2200,3200,4500,6000,8000,10000];
  var COMBO_STEP = 0.1;
  var COMBO_STEP_CAP = 5; // combo 6+ caps the bonus at +50%

  var board = [];
  var score = 0;
  var bestScore = 0;
  var bestChain = 0;
  var bestFlowers = 0;
  var currentMaxChain = 0;
  var flowerCount = 0;
  var bigFlowerCount = 0;
  var gameOver = false;
  var comboCount = 0;
  var maxComboThisRun = 0;
  var milestoneIdx = 0;
  var milestonesReached = 0;

  var path = [];
  var dragging = false;

  var boardEl = document.getElementById("board");
  var boardFrameEl = document.getElementById("boardFrame");
  var scoreValEl = document.getElementById("scoreVal");
  var bestValEl = document.getElementById("bestVal");
  var sumValEl = document.getElementById("sumVal");
  var sumReadoutEl = document.getElementById("sumReadout");
  var flowerValEl = document.getElementById("flowerVal");
  var bigFlowerValEl = document.getElementById("bigFlowerVal");
  var chainValEl = document.getElementById("chainVal");
  var comboBadgeEl = document.getElementById("comboBadge");
  var overlayEl = document.getElementById("overlay");
  var resetBtn = document.getElementById("resetBtn");
  var playAgainBtn = document.getElementById("playAgainBtn");

  function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

  function key(r,c){ return r+","+c; }

  function inBounds(r,c){ return r>=0 && r<SIZE && c>=0 && c<SIZE; }

  function neighbors8(r,c){
    var out = [];
    for(var dr=-1; dr<=1; dr++){
      for(var dc=-1; dc<=1; dc++){
        if(dr===0 && dc===0) continue;
        var nr=r+dr, nc=c+dc;
        if(inBounds(nr,nc)) out.push([nr,nc]);
      }
    }
    return out;
  }

  function emptyBoard(){
    var b = [];
    for(var r=0;r<SIZE;r++){
      var row = [];
      for(var c=0;c<SIZE;c++) row.push(null);
      b.push(row);
    }
    return b;
  }

  function getOccupied(b){
    var out = [];
    for(var r=0;r<SIZE;r++) for(var c=0;c<SIZE;c++) if(b[r][c]) out.push([r,c]);
    return out;
  }

  function getEmpty(b){
    var out = [];
    for(var r=0;r<SIZE;r++) for(var c=0;c<SIZE;c++) if(!b[r][c]) out.push([r,c]);
    return out;
  }

  function shuffleArr(arr){
    for(var i=arr.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }

  function shuffleValues(b){
    var occ = getOccupied(b);
    var vals = occ.map(function(p){ return b[p[0]][p[1]].value; });
    shuffleArr(vals);
    occ.forEach(function(p,i){ b[p[0]][p[1]].value = vals[i]; });
  }

  function regenerateValues(b){
    var occ = getOccupied(b);
    occ.forEach(function(p){ b[p[0]][p[1]].value = randInt(1,9); });
  }

  function hasValidPath(b){
    var occ = getOccupied(b);
    for(var i=0;i<occ.length;i++){
      var r=occ[i][0], c=occ[i][1];
      if(existsPathFrom(b, r, c)) return true;
      var neigh = neighbors8(r,c);
      for(var j=0;j<neigh.length;j++){
        var nr=neigh[j][0], nc=neigh[j][1];
        if(b[nr][nc] && b[nr][nc].value === b[r][c].value) return true;
      }
    }
    return false;
  }

  function existsPathFrom(b, sr, sc){
    var visited = {};
    function rec(r,c,sum,len){
      if(sum===10 && len>=2) return true;
      if(sum>=10) return false;
      visited[key(r,c)] = true;
      var neigh = neighbors8(r,c);
      for(var i=0;i<neigh.length;i++){
        var nr=neigh[i][0], nc=neigh[i][1];
        var k = key(nr,nc);
        if(visited[k]) continue;
        if(!b[nr][nc]) continue;
        var ns = sum + b[nr][nc].value;
        if(ns<=10){
          if(rec(nr,nc,ns,len+1)) return true;
        }
      }
      delete visited[k=key(r,c)];
      return false;
    }
    return rec(sr,sc,b[sr][sc].value,1);
  }

  function ensureSolvable(b){
    var attempts = 0;
    while(!hasValidPath(b) && attempts<MAX_SOLVE_ATTEMPTS){
      attempts++;
      if(attempts<=SHUFFLE_ATTEMPTS_BEFORE_REGEN){
        shuffleValues(b);
      } else {
        regenerateValues(b);
      }
    }
  }

  function applyGravity(b){
    for(var c=0;c<SIZE;c++){
      var colVals = [];
      for(var r=SIZE-1;r>=0;r--){ if(b[r][c]) colVals.push(b[r][c]); }
      for(var r2=SIZE-1;r2>=0;r2--){
        var idxFromBottom = SIZE-1-r2;
        b[r2][c] = colVals[idxFromBottom] || null;
      }
    }
  }

  function spawnGrowth(b, count){
    var empties = shuffleArr(getEmpty(b)).slice(0,count);
    empties.forEach(function(p){
      b[p[0]][p[1]] = { value: randInt(1,9), isNew:true };
    });
    return empties.length;
  }

  function newGame(){
    board = emptyBoard();
    var cells = [];
    for(var r=0;r<SIZE;r++) for(var c=0;c<SIZE;c++) cells.push([r,c]);
    shuffleArr(cells);
    cells.slice(0,INITIAL_TILES).forEach(function(p){
      board[p[0]][p[1]] = { value: randInt(1,9), isNew:false };
    });
    ensureSolvable(board);

    score = 0;
    currentMaxChain = 0;
    flowerCount = 0;
    bigFlowerCount = 0;
    gameOver = false;
    path = [];
    dragging = false;
    comboCount = 0;
    maxComboThisRun = 0;
    milestoneIdx = 0;
    milestonesReached = 0;

    overlayEl.classList.add("hidden");
    fitBoard();
    renderAll();
    renderCombo();
  }

  function currentSum(){
    var s = 0;
    for(var i=0;i<path.length;i++){
      var p = path[i];
      s += board[p.r][p.c].value;
    }
    return s;
  }

  function pathStreakValue(){
    if(path.length===0) return null;
    var v = board[path[0].r][path[0].c].value;
    for(var i=1;i<path.length;i++){
      if(board[path[i].r][path[i].c].value !== v) return null;
    }
    return v;
  }

  function inPath(r,c){
    for(var i=0;i<path.length;i++) if(path[i].r===r && path[i].c===c) return true;
    return false;
  }

  function commitMatch(matched, matchType){
    var n = matched.length;
    var base = matchType==="sum10" ? 5 : 3;
    var comboMultiplier = 1 + Math.min(comboCount-1, COMBO_STEP_CAP)*COMBO_STEP;
    var gained = Math.round(base*n*n*comboMultiplier);
    score += gained;
    currentMaxChain = Math.max(currentMaxChain, n);
    maxComboThisRun = Math.max(maxComboThisRun, comboCount);

    if(n===4){
      flowerCount++;
    } else if(n>=5){
      bigFlowerCount++;
    }

    matched.forEach(function(p){ board[p.r][p.c] = null; });
    applyGravity(board);

    checkMilestones();

    var empties = getEmpty(board);
    if(empties.length < GROWTH_COUNT){
      endGame();
      return;
    }
    spawnGrowth(board, GROWTH_COUNT);
    ensureSolvable(board);
    renderAll();
    renderCombo();
  }

  function checkMilestones(){
    while(milestoneIdx<MILESTONES.length && score>=MILESTONES[milestoneIdx]){
      milestonesReached++;
      showMilestoneToast(MILESTONES[milestoneIdx]);
      milestoneIdx++;
    }
  }

  function showMilestoneToast(threshold){
    var t = document.createElement("div");
    t.className = "milestone-toast";
    t.textContent = "🎉 " + threshold + "점 돌파!";
    document.body.appendChild(t);
    requestAnimationFrame(function(){ t.classList.add("show"); });
    setTimeout(function(){
      t.classList.remove("show");
      setTimeout(function(){ t.remove(); }, 300);
    }, 1400);
  }

  function renderCombo(){
    if(comboCount>=2){
      comboBadgeEl.textContent = "🔥×" + comboCount;
      comboBadgeEl.classList.add("active");
    } else {
      comboBadgeEl.classList.remove("active");
    }
  }

  function endGame(){
    gameOver = true;
    var totalFlowers = flowerCount + bigFlowerCount;
    var newBestScore = score > bestScore;
    bestScore = Math.max(bestScore, score);
    bestChain = Math.max(bestChain, currentMaxChain);
    bestFlowers = Math.max(bestFlowers, totalFlowers);
    try{
      localStorage.setItem(LS_BEST_SCORE, String(bestScore));
      localStorage.setItem(LS_BEST_CHAIN, String(bestChain));
      localStorage.setItem(LS_BEST_FLOWERS, String(bestFlowers));
    }catch(e){}

    document.getElementById("finalScore").textContent = score;
    document.getElementById("finalBest").textContent = bestScore;
    document.getElementById("finalChain").textContent = currentMaxChain;
    document.getElementById("finalFlowers").textContent = totalFlowers;
    document.getElementById("finalCombo").textContent = maxComboThisRun + "연속";
    document.getElementById("finalMilestones").textContent = milestonesReached;
    document.getElementById("finalScoreRow").classList.toggle("new-best", newBestScore);

    lastRunStats = { score: score, chain: currentMaxChain, flowers: totalFlowers };
    submitRankBtn.disabled = false;
    setRankStatus("", "");
    checkTopScoreHighlight(score);

    renderAll();
    overlayEl.classList.remove("hidden");
  }

  function loadBests(){
    try{
      bestScore = parseInt(localStorage.getItem(LS_BEST_SCORE),10) || 0;
      bestChain = parseInt(localStorage.getItem(LS_BEST_CHAIN),10) || 0;
      bestFlowers = parseInt(localStorage.getItem(LS_BEST_FLOWERS),10) || 0;
    }catch(e){
      bestScore = 0; bestChain = 0; bestFlowers = 0;
    }
  }

  var lastFrameW = -1, lastFrameH = -1;
  function fitBoard(){
    var frameW = boardFrameEl.clientWidth, frameH = boardFrameEl.clientHeight;
    lastFrameW = frameW; lastFrameH = frameH;
    var cs = getComputedStyle(boardFrameEl);
    var padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    var padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    var availW = frameW - padX;
    var availH = frameH - padY;
    var size = Math.floor(Math.max(0, Math.min(availW, availH)));
    if(size > 0){
      boardEl.style.width = size + "px";
      boardEl.style.height = size + "px";
    }
  }

  // Event-driven recompute (fires instantly on real devices)
  window.addEventListener("resize", fitBoard);
  window.addEventListener("orientationchange", fitBoard);
  if(typeof ResizeObserver !== "undefined"){
    new ResizeObserver(fitBoard).observe(boardFrameEl);
  }
  // Polling fallback: guarantees the board never drifts out of sync with its
  // frame even on browsers/situations where resize signals are unreliable
  // (dynamic URL bar show/hide, foldables, some in-app webviews).
  setInterval(function(){
    if(boardFrameEl.clientWidth !== lastFrameW || boardFrameEl.clientHeight !== lastFrameH){
      fitBoard();
    }
  }, 400);

  function buildBoardDom(){
    boardEl.innerHTML = "";
    for(var r=0;r<SIZE;r++){
      for(var c=0;c<SIZE;c++){
        var el = document.createElement("div");
        el.className = "tile empty";
        el.dataset.r = r;
        el.dataset.c = c;
        boardEl.appendChild(el);
      }
    }
  }

  function renderBoard(){
    for(var r=0;r<SIZE;r++){
      for(var c=0;c<SIZE;c++){
        var el = boardEl.children[r*SIZE+c];
        var cell = board[r][c];
        el.classList.remove("new-tile");
        if(!cell){
          el.className = "tile empty";
          el.textContent = "";
          continue;
        }
        el.className = "tile" + (cell.isNew ? " new-tile" : "");
        el.textContent = cell.value;
        if(cell.isNew){
          (function(elc){ setTimeout(function(){ elc.classList.remove("new-tile"); }, 260); })(el);
          cell.isNew = false;
        }
      }
    }
    updateSelectionVisuals();
  }

  function updateSelectionVisuals(){
    for(var i=0;i<boardEl.children.length;i++){
      boardEl.children[i].classList.remove("selected","ready");
    }
    var sum = currentSum();
    var streakVal = pathStreakValue();
    var isSum10 = sum===10 && path.length>=2;
    var isSameNum = path.length>=2 && streakVal!==null;
    var ready = isSum10 || isSameNum;
    path.forEach(function(p){
      var el = boardEl.children[p.r*SIZE+p.c];
      el.classList.add("selected");
      if(ready) el.classList.add("ready");
    });
    var of10El = sumReadoutEl.querySelector(".of10");
    if(isSameNum && !isSum10){
      sumValEl.textContent = streakVal + "×" + path.length;
      of10El.textContent = "";
    } else {
      sumValEl.textContent = sum;
      of10El.textContent = "/10";
    }
    sumReadoutEl.classList.toggle("ready", ready);
  }

  function renderStats(){
    scoreValEl.textContent = score;
    bestValEl.textContent = bestScore;
    flowerValEl.textContent = flowerCount;
    bigFlowerValEl.textContent = bigFlowerCount;
    chainValEl.textContent = currentMaxChain;
  }

  function renderAll(){
    renderBoard();
    renderStats();
  }

  function flashReject(r,c){
    var el = boardEl.children[r*SIZE+c];
    el.classList.add("reject");
    setTimeout(function(){ el.classList.remove("reject"); }, 220);
    if(navigator.vibrate){ try{ navigator.vibrate(15); }catch(e){} }
  }

  function tileFromPoint(x,y){
    var el = document.elementFromPoint(x,y);
    if(!el) return null;
    var t = el.closest ? el.closest(".tile") : null;
    if(!t || !t.dataset) return null;
    return t;
  }

  function handleEnterTile(r,c){
    var last = path[path.length-1];
    if(last.r===r && last.c===c) return;

    if(path.length>=2){
      var prev = path[path.length-2];
      if(prev.r===r && prev.c===c){
        path.pop();
        updateSelectionVisuals();
        return;
      }
    }

    if(inPath(r,c)) return;

    var dr = Math.abs(r-last.r), dc = Math.abs(c-last.c);
    if(dr>1 || dc>1) return;

    var newVal = board[r][c].value;
    var sum = currentSum() + newVal;
    var streakVal = pathStreakValue();
    var streakOk = streakVal!==null && streakVal===newVal;
    if(sum>10 && !streakOk){
      flashReject(r,c);
      return;
    }
    path.push({r:r,c:c});
    updateSelectionVisuals();
  }

  function evaluatePath(){
    var sum = currentSum();
    var streakVal = pathStreakValue();
    var isSum10 = sum===10 && path.length>=2;
    var isSameNum = path.length>=2 && streakVal!==null;
    if(isSum10 || isSameNum){
      var matched = path.slice();
      var matchType = isSum10 ? "sum10" : "sameNumber";
      path = [];
      comboCount++;
      commitMatch(matched, matchType);
    } else {
      if(path.length>=2){
        comboCount = 0;
        renderCombo();
      }
      path = [];
      updateSelectionVisuals();
    }
  }

  function onPointerDown(e){
    if(gameOver) return;
    var t = e.target.closest ? e.target.closest(".tile") : null;
    if(!t) return;
    var r = +t.dataset.r, c = +t.dataset.c;
    if(!board[r][c]) return;
    dragging = true;
    path = [{r:r,c:c}];
    updateSelectionVisuals();
    document.addEventListener("pointermove", onPointerMove);
    document.addEventListener("pointerup", onPointerUp);
    document.addEventListener("pointercancel", onPointerUp);
    e.preventDefault();
  }

  function onPointerMove(e){
    if(!dragging) return;
    e.preventDefault();
    var t = tileFromPoint(e.clientX, e.clientY);
    if(!t) return;
    var r = +t.dataset.r, c = +t.dataset.c;
    if(!board[r][c]) return;
    handleEnterTile(r,c);
  }

  function onPointerUp(e){
    if(!dragging) return;
    dragging = false;
    document.removeEventListener("pointermove", onPointerMove);
    document.removeEventListener("pointerup", onPointerUp);
    document.removeEventListener("pointercancel", onPointerUp);
    evaluatePath();
  }

  buildBoardDom();
  boardEl.addEventListener("pointerdown", onPointerDown);
  resetBtn.addEventListener("click", function(){
    if(!gameOver){
      var ok = window.confirm("현재 진행 중인 판을 포기하고 새로 시작할까요?");
      if(!ok) return;
    }
    newGame();
  });
  playAgainBtn.addEventListener("click", newGame);

  loadBests();
  newGame();

  // ---- Leaderboard (Firebase) wiring ----
  var LS_NICKNAME = "tengarden-nickname";
  var nicknameInput = document.getElementById("nicknameInput");
  var submitRankBtn = document.getElementById("submitRankBtn");
  var rankStatusEl = document.getElementById("rankStatus");
  var leaderboardBtn = document.getElementById("leaderboardBtn");
  var leaderboardOverlayEl = document.getElementById("leaderboardOverlay");
  var leaderboardListEl = document.getElementById("leaderboardList");
  var closeLeaderboardBtn = document.getElementById("closeLeaderboardBtn");
  var rankHighlightEl = document.getElementById("rankHighlight");

  var lastRunStats = null;

  function setRankStatus(text, cls){
    rankStatusEl.textContent = text;
    rankStatusEl.className = "rank-status" + (cls ? " " + cls : "");
  }

  function checkTopScoreHighlight(finalScore){
    rankHighlightEl.classList.remove("show");
    if(!window.TG_FB) return;
    window.TG_FB.fetchLeaderboard(1).then(function(result){
      if(result.status !== "ok") return;
      var currentTop = result.rows.length ? result.rows[0].score : 0;
      if(finalScore > currentTop){
        rankHighlightEl.classList.add("show");
      }
    });
  }

  try{
    var savedNickname = localStorage.getItem(LS_NICKNAME);
    if(savedNickname) nicknameInput.value = savedNickname;
  }catch(e){}

  submitRankBtn.addEventListener("click", function(){
    if(!lastRunStats) return;
    var name = nicknameInput.value.trim();
    if(!name){
      setRankStatus("닉네임을 입력해주세요.", "err");
      return;
    }
    if(!window.TG_FB){
      setRankStatus("랭킹 서버 연결 준비 중이에요. 잠시 후 다시 시도해주세요.", "err");
      return;
    }
    try{ localStorage.setItem(LS_NICKNAME, name); }catch(e){}
    submitRankBtn.disabled = true;
    setRankStatus("등록 중...", "");
    window.TG_FB.submitScore({
      name: name,
      score: lastRunStats.score,
      chain: lastRunStats.chain,
      flowers: lastRunStats.flowers
    }).then(function(result){
      submitRankBtn.disabled = false;
      if(result.status === "ok"){
        setRankStatus("랭킹에 등록했습니다! 🎉", "ok");
      } else if(result.status === "lower"){
        setRankStatus("이미 더 높은 기록(" + result.existingScore + "점)이 있어요.", "");
      } else {
        setRankStatus(result.message || "등록에 실패했습니다.", "err");
      }
    });
  });

  function renderLeaderboard(rows){
    leaderboardListEl.innerHTML = "";
    if(!rows || rows.length===0){
      var empty = document.createElement("div");
      empty.className = "leaderboard-empty";
      empty.textContent = "아직 등록된 기록이 없어요. 첫 기록의 주인공이 되어보세요!";
      leaderboardListEl.appendChild(empty);
      return;
    }
    rows.forEach(function(row, i){
      var el = document.createElement("div");
      el.className = "leaderboard-row";
      var rank = document.createElement("div");
      rank.className = "rank";
      rank.textContent = "#" + (i+1);
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = row.name || "?";
      var score = document.createElement("div");
      score.className = "score";
      score.textContent = row.score;
      el.appendChild(rank); el.appendChild(name); el.appendChild(score);
      leaderboardListEl.appendChild(el);
    });
  }

  leaderboardBtn.addEventListener("click", function(){
    leaderboardOverlayEl.classList.remove("hidden");
    leaderboardListEl.innerHTML = '<div class="leaderboard-empty">불러오는 중...</div>';
    if(!window.TG_FB){
      leaderboardListEl.innerHTML = '<div class="leaderboard-error">랭킹 서버 연결 준비 중이에요. 잠시 후 다시 시도해주세요.</div>';
      return;
    }
    window.TG_FB.fetchLeaderboard(20).then(function(result){
      if(result.status === "ok"){
        renderLeaderboard(result.rows);
      } else {
        leaderboardListEl.innerHTML = '<div class="leaderboard-error">' + (result.message || "랭킹을 불러오지 못했습니다.") + '</div>';
      }
    });
  });

  closeLeaderboardBtn.addEventListener("click", function(){
    leaderboardOverlayEl.classList.add("hidden");
  });
})();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import {
    getFirestore, doc, getDoc, setDoc, collection, query, orderBy, limit, getDocs, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  var firebaseConfig = {
    apiKey: "AIzaSyBsNv2jOafEwR9JRVgLKgxFvYkE-e6WtzI",
    authDomain: "hexagarden.firebaseapp.com",
    projectId: "hexagarden",
    storageBucket: "hexagarden.firebasestorage.app",
    messagingSenderId: "515436589016",
    appId: "1:515436589016:web:fe41eb41a994ab5cac4cad"
  };

  var app = initializeApp(firebaseConfig);
  var db = getFirestore(app);
  var COLLECTION = "tengarden_scores";

  function normalizeId(name){
    return name.trim().toLowerCase().replace(/[^a-z0-9가-힣_-]/g, "").slice(0, 20);
  }

  async function submitScore(entry){
    var id = normalizeId(entry.name);
    if(!id) return { status: "error", message: "닉네임을 입력해주세요." };
    try{
      var ref = doc(db, COLLECTION, id);
      var snap = await getDoc(ref);
      if(snap.exists() && snap.data().score >= entry.score){
        return { status: "lower", existingScore: snap.data().score };
      }
      await setDoc(ref, {
        name: entry.name.trim().slice(0,12),
        score: entry.score,
        chain: entry.chain,
        flowers: entry.flowers,
        updatedAt: serverTimestamp()
      });
      return { status: "ok" };
    }catch(err){
      return { status: "error", message: "등록에 실패했습니다. 네트워크를 확인해주세요." };
    }
  }

  async function fetchLeaderboard(n){
    try{
      var q = query(collection(db, COLLECTION), orderBy("score", "desc"), limit(n));
      var snap = await getDocs(q);
      var rows = [];
      snap.forEach(function(d){ rows.push(d.data()); });
      return { status: "ok", rows: rows };
    }catch(err){
      return { status: "error", message: "랭킹을 불러오지 못했습니다." };
    }
  }

  window.TG_FB = { submitScore: submitScore, fetchLeaderboard: fetchLeaderboard };
</script>
